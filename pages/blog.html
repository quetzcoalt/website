<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../components/NavBar.js" defer></script>
    <script type="module" src="../components/Blog.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>now;</title>
</head>
<body>
    <div class="main-body">
        <nav-bar base-path=".."></nav-bar>
        <div class="about-section">
            <h3 style="font-size: 20px;" class="intro-text">
              -> Just some ramblings...
            </h3>
            
            <div class="about-wrapper">
                <div class="bar"></div>
                <span class="about-title">
                    <span class="caret-deco">&gt;</span> Blog
                </span>
                <img class="img-source" src="/media/gifs/clippy.gif" alt="">
                <div class="bar"></div>
            </div>

            <blog-page></blog-page>

        </div>
    </div>

    <script>
        if (window.location.hostname.includes('github.io')) {
            document.querySelectorAll('img.markdown-source').forEach(img => {
                const currentSrc = img.getAttribute('src');
                if (currentSrc && currentSrc.startsWith('/media/')) {
                    img.setAttribute('src', '/website' + currentSrc);
                }
            });
        }
    </script>
</body>
</html>
