<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../components/NavBar.js" defer></script>
    <title>codebase;</title>
</head>
<body>
    <div class="main-body">
        <nav-bar base-path=".."></nav-bar>
        <div class="about-section">
            <h3 class="intro-text">
              -> I mostly learn through project-based learning. This approach helps me understand concepts better and keeps me motivated to build more.
            </h3>
            <div class="divider-div">
                <img class="divider" src="/media/dividers/thorndivider.gif" alt="">
            </div> 
            <div class="about-wrapper">
                <div class="bar"></div>
                <span class="about-title">
                    <span class="caret-deco">&gt;</span> Codebase
                </span>
                <img src="/media/gifs/computer.gif" alt="">
                <div class="bar"></div>
            </div>
            <div class="codebase" id="codebase"></div>
        </div>
    <script type="module" src="../components/Code.js">
        if (window.location.hostname.includes('github.io')) {
            document.querySelectorAll('img.markdown-image').forEach(img => {
                const currentSrc = img.getAttribute('src');
                if (currentSrc && currentSrc.startsWith('/media/')) {
                    img.setAttribute('src', '/website' + currentSrc);
                }
            });
        }
    </script>
</body>
</html>
