<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../components/NavBar.js" defer></script>
    <script type="module" src="../components/Blog.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>now;</title>
</head>
<body>
    <div class="main-body">
        <nav-bar base-path=".."></nav-bar>
        <div class="about-section">
            <h3 class="intro-text">
              This is dedicated to everything else I want to share;
            </h3>
            
            <div class="about-wrapper">
                <div class="bar"></div>
                <span class="about-title">
                    <span class="caret-deco">&gt;</span> Misc
                </span>
                <img class="img-source" src="/media/icons/telescope.gif" alt="">
                <div class="bar"></div>
            </div>

            <div class="misc-links">
                <a class="gallery-link">
                    <h3 class="gallery-title">Drawings</h3>
                    <p class="gallery-description">A collection of my drawings and paintings</p>
                </a>
                <div class="more-stuff-wrap">
                    <p class="more-stuff-text">{ Will add more stuff soon :D }</p>
                </div>
            </div>

            <div class="about-wrapper">
                <div class="bar"></div>
                <span class="about-title">
                    <span class="caret-deco">&gt;</span> My other live websites:
                </span>
                <img class="img-source" src="/media/gifs/computer.gif" alt="">
                <div class="bar"></div>
            </div>
            
            <h3 class="description-text">
              Beware, some of them are kinda wonky, but I'd like to share them anyways ;)
            </h3>

            <img class="under-construction" src="/media/gifs/under_construction.gif" alt="">
        </div>
    <script>
         if (window.location.hostname.includes('github.io')) {
            document.querySelectorAll('img.img-source').forEach(img => {
                const currentSrc = img.getAttribute('src');
                if (currentSrc && currentSrc.startsWith('/media/')) {
                    img.setAttribute('src', '/website' + currentSrc);
                }
            });
        }
    </script>
</body>
</html>
